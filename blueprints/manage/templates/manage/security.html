{% extends "manage/manage.html" %} {% block panel %}
<div class="security-page">
  <div class="security-body">
    <!-- left: device list -->
    <div class="security-left">
      <h2 class="security-title">security</h2>
      <div class="sec-device-list" id="sec-device-list">
        {% for device in devices %}
        <button
          class="sec-device-tile {{ 'active' if loop.first }}"
          type="button"
          data-device-id="{{ device.device_id }}"
        >
          <span class="sec-device-name"
            >{{ device.device_name or 'unnamed device' }}</span
          >
          {% if device.last_online and device.last_online >= online_cutoff %}
          <span class="sec-status-dot online"></span>
          <span class="sec-device-ip">{{ device.ip_address or '-' }}</span>
          {% else %}
          <span class="sec-status-dot offline"></span>
          <span class="sec-device-ip">-</span>
          {% endif %}
        </button>
        {% else %}
        <p class="sec-empty">no devices yet</p>
        {% endfor %}
      </div>
    </div>

    <!-- right: 2x2 grid of tiles -->
    <div class="security-grid">
      <!-- tile 1: range + activity stats -->
      <div class="sec-tile sec-stats-tile">
        <div class="range-row">
          <span class="range-label">Range</span>
          <button class="range-pill active" type="button" data-minutes="10">
            10 min
          </button>
          <button class="range-pill" type="button" data-minutes="30">
            30 min
          </button>
          <button class="range-pill" type="button" data-minutes="60">
            1 hr
          </button>
          <button class="range-pill" type="button" data-minutes="1440">
            24 hr
          </button>
        </div>

        <div class="activity-row">
          <span class="activity-since"
            >Activity since:
            <span class="activity-time">{{ since }}</span></span
          >
          <span class="activity-total"
            >total connections: <span class="activity-count">-</span></span
          >
        </div>

        <div class="stats-cols">
          <div class="stats-col">
            <div class="stat-line">
              <span class="stat-label">inbound<br />packets</span>
              <span class="stat-value" data-stat="in-packets">-</span>
            </div>
            <div class="stat-line">
              <span class="stat-label">Bytes</span>
              <span class="stat-value" data-stat="in-bytes">-</span>
            </div>
            <div class="stat-line">
              <span class="stat-label">TCP</span>
              <span class="stat-value" data-stat="tcp">-</span>
            </div>
            <div class="stat-line">
              <span class="stat-label">UDP</span>
              <span class="stat-value" data-stat="udp">-</span>
            </div>
          </div>

          <div class="stats-col stats-col-right">
            <div class="stat-line">
              <span class="stat-label">outbound<br />packets</span>
              <span class="stat-value" data-stat="out-packets">-</span>
            </div>
            <div class="stat-line">
              <span class="stat-label">Bytes</span>
              <span class="stat-value" data-stat="out-bytes">-</span>
            </div>
            <div class="stat-line">
              <span class="stat-label">TCP</span>
              <span class="stat-value" data-stat="tcp">-</span>
            </div>
            <div class="stat-line">
              <span class="stat-label">UDP</span>
              <span class="stat-value" data-stat="udp">-</span>
            </div>
          </div>
        </div>
      </div>

      <!-- tile 2: traffic chart (placeholder) -->
      <div class="sec-tile sec-chart-tile"></div>

      <!-- tile 3: IDS flags (placeholder) -->
      <div class="sec-tile sec-ids-tile">
        <h3 class="sec-tile-title">IDS flags</h3>
      </div>

      <!-- tile 4: placeholder -->
      <div class="sec-tile sec-blank-tile"></div>
    </div>
  </div>
</div>

<script>
  const secList = document.getElementById("sec-device-list");
  const activityTime = document.querySelector(".activity-time");
  const activityCount = document.querySelector(".activity-count");

  // ----- helpers -----
  function selectedDeviceId() {
    const tile = secList.querySelector(".sec-device-tile.active");
    return tile ? tile.dataset.deviceId : null;
  }

  function selectedMinutes() {
    const pill = document.querySelector(".range-pill.active");
    return pill ? Number(pill.dataset.minutes) : 10;
  }

  // "Activity since" time for a range, in EST (UTC-5), formatted "HH:MM EST"
  function sinceLabel(minutes) {
    const est = new Date(Date.now() - (5 * 60 + minutes) * 60 * 1000);
    const hh = String(est.getUTCHours()).padStart(2, "0");
    const mm = String(est.getUTCMinutes()).padStart(2, "0");
    return `${hh}:${mm} EST`;
  }

  const nf = new Intl.NumberFormat("en-US");

  function fmtBytes(n) {
    if (n < 1024) return nf.format(n) + " B";
    const units = ["KB", "MB", "GB", "TB"];
    let v = n / 1024;
    let i = 0;
    while (v >= 1024 && i < units.length - 1) {
      v /= 1024;
      i++;
    }
    return v.toFixed(v >= 100 ? 0 : 1) + " " + units[i];
  }

  function setStat(key, value) {
    document
      .querySelectorAll(`.stat-value[data-stat="${key}"]`)
      .forEach((el) => (el.textContent = value));
  }

  function clearStats(placeholder) {
    ["in-packets", "in-bytes", "out-packets", "out-bytes", "tcp", "udp"].forEach(
      (k) => setStat(k, placeholder)
    );
    activityCount.textContent = placeholder;
  }

  // ----- load stats for the selected device + range -----
  async function loadStats() {
    activityTime.textContent = sinceLabel(selectedMinutes());

    const deviceId = selectedDeviceId();
    if (!deviceId) {
      clearStats("-");
      return;
    }

    clearStats("...");
    try {
      const res = await fetch("/api/security/stats", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          device_id: Number(deviceId),
          minutes: selectedMinutes(),
        }),
      });
      if (!res.ok) throw new Error(res.status);
      const d = await res.json();

      activityCount.textContent = nf.format(d.total_connections);
      setStat("in-packets", nf.format(d.inbound.packets));
      setStat("in-bytes", fmtBytes(d.inbound.bytes));
      setStat("out-packets", nf.format(d.outbound.packets));
      setStat("out-bytes", fmtBytes(d.outbound.bytes));
      setStat("tcp", nf.format(d.tcp));
      setStat("udp", nf.format(d.udp));
    } catch {
      clearStats("—");
    }
  }

  // ----- device selection -----
  secList.addEventListener("click", (e) => {
    const tile = e.target.closest(".sec-device-tile");
    if (!tile) return;
    secList
      .querySelectorAll(".sec-device-tile.active")
      .forEach((t) => t.classList.remove("active"));
    tile.classList.add("active");
    loadStats();
  });

  // ----- range pills -----
  document.querySelectorAll(".range-pill").forEach((pill) => {
    pill.addEventListener("click", () => {
      document
        .querySelectorAll(".range-pill.active")
        .forEach((p) => p.classList.remove("active"));
      pill.classList.add("active");
      loadStats();
    });
  });

  // initial load (default device + range)
  loadStats();
</script>
{% endblock %}
