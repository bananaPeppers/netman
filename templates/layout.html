{% extends "base.html" %} {% block page_styles %}
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/home.css') }}"
/>
{% endblock %} {% block content %}
<header>
  <div class="top-row">
    <h1 class="h1-netman">netman</h1>
    <nav>
      <a
        class="nav-btn {{ 'active' if request.endpoint == 'monitor' }}"
        href="{{ url_for('monitor') }}"
        >monitor</a
      >
      <a
        class="nav-btn {{ 'active' if request.endpoint == 'manage' }}"
        href="{{ url_for('manage') }}"
        >manage</a
      >
      <a
        class="nav-btn {{ 'active' if request.endpoint == 'secure' }}"
        href="{{ url_for('secure') }}"
        >secure</a
      >
    </nav>
    <form class="logout-form" method="post" action="{{ url_for('logout') }}">
      <button class="logout-btn" type="submit" aria-label="Log out" title="log out">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
      </button>
    </form>
  </div>
  <div class="line"></div>
</header>
<main>{% block page %}{% endblock %}</main>
{% endblock %}
