<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}NetMan{% endblock %}</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/base.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/components/button.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/components/popup.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/components/input.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/components/toggle.css') }}"
    />
    {% block page_styles %}{% endblock %}
  </head>
  <body>
    {% block content %}{% endblock %}
    <script src="{{ url_for('static', filename='js/base.js') }}"></script>
  </body>
</html>
